# Coloque este arquivo em:  .github/workflows/calendar.yml   (no repositório FX-Terminal-USDBRL)
# Função: baixa o calendário econômico semanal (ForexFactory) NO SERVIDOR do GitHub e salva
# como ff_calendar.json ao lado do index.html. O app lê esse arquivo do mesmo domínio,
# o que elimina qualquer bloqueio CORS do navegador e o limite de requisições (429).
name: Atualizar calendario economico
on:
  schedule:
    - cron: '*/30 10-23 * * 1-5'   # a cada 30 min, seg-sex (horário UTC)
  workflow_dispatch: {}            # permite rodar manualmente (aba Actions > Run workflow)
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar calendario
        run: |
          curl -fsSL --retry 3 -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36" \
            "https://nfs.faireconomy.media/ff_calendar_thisweek.json" -o ff_calendar.json.tmp
          python3 -c "import json; d=json.load(open('ff_calendar.json.tmp')); assert isinstance(d,list) and d"
          mv ff_calendar.json.tmp ff_calendar.json
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add ff_calendar.json
          git diff --cached --quiet || (git commit -m "calendario: atualizacao automatica" && git push)
