# Arquivo: .github/workflows/macro.yml
# Baixa macro dos EUA + Treasury da Alpha Vantage NO SERVIDOR do GitHub e grava data/macro.json.
# Independente do calendar.yml (que continua igual). Chave: GitHub Secret ALPHAVANTAGE_KEY.
# Consumo: 6 chamadas por execução x 2 execuções/dia = 12/dia (cuidado ao disparar manualmente).
name: Atualizar macro EUA (Alpha Vantage)
on:
  schedule:
    - cron: '30 14,22 * * 1-5'   # 11:30 e 19:30 (Brasília), seg-sex — horário UTC no cron
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar macro (Alpha Vantage)
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
        run: python3 scripts/fetch_alphavantage.py

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/macro.json
          if git diff --cached --quiet; then
            echo "sem mudancas"
          else
            git commit -m "dados: macro EUA (Alpha Vantage)"
            for i in 1 2 3; do
              git pull --rebase && git push && break
              sleep 5
            done
          fi
